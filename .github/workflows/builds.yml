
name: Master
on:
  push:
    branches:
      - master

jobs:
  build_job:
    name: Build master branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
        - build: x86_64-windows
          os: windows-latest
          target: x86_64-pc-windows-msvc
          bin_name: silicate.exe
        - build: x86_64-linux
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          bin_name: silicate
        - build: x86_64-macos
          os: macos-latest
          target: x86_64-apple-darwin
          bin_name: silicate
        - build: aarch64-macos
          os: macos-latest
          target: aarch64-apple-darwin
          bin_name: silicate
        - build: wasm32
          os: ubuntu-latest
          target: wasm32-unknown-unknown
          bin_name: silicate.wasm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.build }}-${{ matrix.bin_name }}
          path: dist

  thumbs_job:
    name: Build Explorer thumbnail DLL
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          target: x86_64-pc-windows-msvc
        - arch: arm64
          target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: thumbs-${{ matrix.arch }}

      - name: Build thumbnail DLL
        run: cargo xtask thumbs build --arch ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: thumbs-${{ matrix.arch }}-win_procreate_thumbs_${{ matrix.arch }}.dll
          path: target/silica-thumbs/win_procreate_thumbs_${{ matrix.arch }}.dll
          if-no-files-found: error
