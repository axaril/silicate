
name: Releases
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BIN_NAME: silicate
  BUNDLE_NAME: Silicate

jobs:
  build_job:
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        include:
        - build: x86_64-linux
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          bundle: silicate
        - build: x86_64-macos
          os: macos-latest
          target: x86_64-apple-darwin
          bundle: Silicate-macos-x86_64.dmg
        - build: x86_64-windows
          os: windows-latest
          target: x86_64-pc-windows-msvc
          bundle: Silicate.exe
        - build: aarch64-macos
          os: macos-latest
          target: aarch64-apple-darwin
          bundle: Silicate-macos-arm64.dmg

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        if: matrix.os == 'macos-latest'
        run: cargo install cargo-bundle

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS bundle
        if: matrix.os == 'macos-latest'
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Package macOS DMG
        shell: bash
        if: matrix.os == 'macos-latest'
        run: >-
            hdiutil create "target/${{ matrix.target }}/release/bundle/osx/${{ matrix.bundle }}"
            -volname "${{ env.BUNDLE_NAME }}"
            -srcfolder "target/${{ matrix.target }}/release/bundle/osx/${{ env.BUNDLE_NAME }}.app" -ov

      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "dist/${{ matrix.bundle }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp "target/${{ matrix.target }}/release/bundle/osx/${{ matrix.bundle }}" "dist/${{ matrix.bundle }}"
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/${{ matrix.bundle }}"
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.bundle }}

  thumbs_job:
    name: Build Explorer thumbnail DLL
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          target: x86_64-pc-windows-msvc
        - arch: arm64
          target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: thumbs-${{ matrix.arch }}

      - name: Build thumbnail DLL
        run: cargo xtask thumbs build --arch ${{ matrix.arch }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/silica-thumbs/silica_thumbs_${{ matrix.arch }}.dll
          fail_on_unmatched_files: true
